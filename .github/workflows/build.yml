# Builds the Android APK and the web version every time you change a file on GitHub.
# APK: Actions tab > latest run > Artifacts > "BM-Work-Tracker-APK"
# Web: https://<your-github-username>.github.io/<repo-name>/
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android + Web folders
        run: flutter create --platforms=android,web --org com.bombaymetrics --project-name bm_work_tracker .

      - name: Apply app settings
        run: bash tool/patch_android.sh

      - name: Use fixed signing key (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed signing key - app updates install over the old version."
          else
            echo "No KEYSTORE_BASE64 secret - uninstall the old app before installing a new APK."
          fi

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: BM-Work-Tracker-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
